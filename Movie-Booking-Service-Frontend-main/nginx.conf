server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ FIX: Use Kubernetes internal DNS resolver (CoreDNS)
  # This prevents nginx from crashing at startup if api-gateway is not yet running.
  # 'valid=10s' re-resolves every 10s; 'ipv6=off' avoids IPv6 lookup failures in minikube.
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

  # ✅ FIX: Use a variable for upstream so nginx does lazy DNS resolution
  # (nginx only crashes at startup if the upstream is hardcoded — using a variable defers it)
  set $api_gateway api-gateway.movie-app.svc.cluster.local;

  location /auth/ {
    proxy_pass http://$api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /matches {
    proxy_pass http://$api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /sessions {
    proxy_pass http://$api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /bookings {
    proxy_pass http://$api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /payment {
    proxy_pass http://$api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
