server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /matches {
    proxy_pass http://api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /sessions {
    proxy_pass http://api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /bookings {
    proxy_pass http://api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /payment {
    proxy_pass http://api_gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
